name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1

      - name: Run tests
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-tests
      - frontend-build
    env:
      API_PORT: "18080"
      COMPOSE_PROGRESS: plain
      COMPOSE_PROJECT_NAME: ci-408-${{ github.run_id }}-${{ github.run_attempt }}
      IMPORT_408_QUESTIONS: "true"
      JUDGE_POLL_INTERVAL: "0.1"
      OJ_PORT: "13080"
      POSTGRES_DB: oj_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_USER: oj_ci
      SEED_DEMO_DATA: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Verify question bank and judge pipeline
        run: python3 scripts/ci_smoke.py
        env:
          OJ_API_URL: http://127.0.0.1:13080/api
          OJ_FRONTEND_URL: http://127.0.0.1:13080

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: |
          docker ps -aq --filter label=local-oj.sandbox=true | xargs -r docker rm -f
          docker compose down --volumes --remove-orphans
